<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Signing pipeline: English line fans out to speech, gloss, and signing branches, gated by QA, delivered on one clock">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #333; stroke-width: 1.5; rx: 6; }
      .title { font: bold 14px sans-serif; fill: #111; }
      .body { font: 13px sans-serif; fill: #333; }
      .edge { stroke: #333; stroke-width: 1.5; fill: none; }
      .elabel { font: italic 12px sans-serif; fill: #555; }
    </style>
  </defs>

  <rect class="box" x="330" y="10" width="200" height="36"/>
  <text class="title" x="430" y="33" text-anchor="middle">English host line</text>

  <rect class="box" x="20" y="90" width="250" height="84"/>
  <text class="title" x="145" y="112" text-anchor="middle">speech</text>
  <text class="body" x="145" y="134" text-anchor="middle">Polly &#8594; viseme &#8594; lipsync</text>

  <rect class="box" x="305" y="90" width="250" height="84"/>
  <text class="title" x="430" y="112" text-anchor="middle">gloss</text>
  <text class="body" x="430" y="134" text-anchor="middle">model &#8594; tokens + timings</text>
  <text class="body" x="430" y="152" text-anchor="middle">lexicon-constrained</text>

  <rect class="box" x="590" y="90" width="250" height="84"/>
  <text class="title" x="715" y="112" text-anchor="middle">signing</text>
  <text class="body" x="715" y="134" text-anchor="middle">chereme + fingerspell</text>
  <text class="body" x="715" y="152" text-anchor="middle">+ face layer</text>

  <line class="edge" x1="380" y1="46" x2="200" y2="90" marker-end="url(#arrow)"/>
  <line class="edge" x1="430" y1="46" x2="430" y2="90" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="46" x2="660" y2="90" marker-end="url(#arrow)"/>
  <line class="edge" x1="555" y1="140" x2="590" y2="140" marker-end="url(#arrow)"/>
  <text class="elabel" x="556" y="132">tokens</text>

  <rect class="box" x="590" y="200" width="250" height="40"/>
  <text class="body" x="715" y="225" text-anchor="middle">gate: hands visible</text>
  <line class="edge" x1="715" y1="174" x2="715" y2="200" marker-end="url(#arrow)"/>

  <rect class="box" x="20" y="290" width="820" height="44"/>
  <text class="body" x="430" y="317" text-anchor="middle">delivery: spoken + captioned + signed, one clock</text>
  <line class="edge" x1="145" y1="174" x2="145" y2="290" marker-end="url(#arrow)"/>
  <line class="edge" x1="715" y1="240" x2="715" y2="290" marker-end="url(#arrow)"/>
</svg>
